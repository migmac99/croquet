<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-5 mb-10 lg:mb-12">
  <div>
    <h2 class="text-2xl sm:text-3xl font-bold">World Map</h2>
    <p class="text-sm sm:text-base text-muted-foreground mt-2">Geographic distribution of synchronizer infrastructure</p>
  </div>
  <div class="flex gap-3">
    <button onclick="location.reload()" class="btn btn-secondary">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
        />
      </svg>
      Refresh
    </button>
    <a href="/ui/synchronizers" class="btn btn-primary">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
      View List
    </a>
  </div>
</div>

<!-- Summary stats -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-10">
  <div class="card p-6">
    <div class="text-sm text-muted-foreground mb-1">Edge Locations</div>
    <div class="text-3xl font-bold">{{total_locations}}</div>
  </div>
  <div class="card p-6">
    <div class="text-sm text-muted-foreground mb-1">Total Sessions</div>
    <div class="text-3xl font-bold">{{total_sessions}}</div>
  </div>
  <div class="card p-6">
    <div class="text-sm text-muted-foreground mb-1">Total Clients</div>
    <div class="text-3xl font-bold">{{total_clients}}</div>
  </div>
</div>

<!-- Map container -->
<div class="card overflow-hidden">
  <div id="map" class="w-full h-[500px] lg:h-[600px]"></div>
</div>

<!-- Legend -->
<div class="mt-5 card p-5">
  <div class="text-sm font-medium mb-3">Legend</div>
  <div class="flex flex-wrap gap-6 text-sm text-muted-foreground" id="legend-items">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-violet-500"></div>
      <span>DO (Durable Object)</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-4 h-4 rounded-full bg-emerald-500"></div>
      <span>Worker (edge location)</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-8 h-0.5 bg-emerald-400 opacity-60" style="border-top: 2px dashed"></div>
      <span>Worker → DO</span>
    </div>
    <!-- Client tracking legend items (shown when tracking enabled) -->
    <div class="flex items-center gap-2 client-legend hidden">
      <div class="w-3 h-3 rounded-full bg-blue-500"></div>
      <span>Lead user</span>
    </div>
    <div class="flex items-center gap-2 client-legend hidden">
      <div class="w-3 h-3 rounded-full bg-gray-400"></div>
      <span>User (client)</span>
    </div>
    <div class="flex items-center gap-2 client-legend hidden">
      <div class="w-8 h-0.5 bg-blue-400 opacity-60" style="border-top: 2px dashed"></div>
      <span>Leader → DO</span>
    </div>
    <div class="flex items-center gap-2 client-legend hidden">
      <div class="w-8 h-0.5 bg-gray-400 opacity-50" style="border-top: 2px dashed"></div>
      <span>Client → DO</span>
    </div>
  </div>
</div>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
  // GeoJSON data embedded from registry
  const geoJsonData = {{geojson_data}};

  // Check if client tracking is enabled
  const trackingEnabled = geoJsonData.trackingEnabled || false;
  const clientMarkers = geoJsonData.clientMarkers || [];

  // Show client legend items if tracking enabled
  if (trackingEnabled && clientMarkers.length > 0) {
    document.querySelectorAll('.client-legend').forEach(el => el.classList.remove('hidden'));
  }

  // Initialize map (zoom 1 = most zoomed out world view)
  const map = L.map('map', {
    center: [20, 0],
    zoom: 1,
    minZoom: 1,
    maxZoom: 18,
    worldCopyJump: true
  });

  // Dark theme tile layer (matches our UI)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);

  // Calculate marker size based on session count
  function getMarkerRadius(sessionCount) {
    const minRadius = 8;
    const maxRadius = 25;
    const minSessions = 1;
    const maxSessions = 100;

    const normalized = Math.min(1, Math.max(0, (sessionCount - minSessions) / (maxSessions - minSessions)));
    return minRadius + (maxRadius - minRadius) * Math.sqrt(normalized);
  }

  // Track DO markers to avoid duplicates (multiple edges may connect to same DO)
  const doMarkersMap = new Map();
  const bounds = L.latLngBounds();

  // Add GeoJSON layer with custom markers and connecting lines
  if (geoJsonData && geoJsonData.features && geoJsonData.features.length > 0) {
    // First pass: draw connecting lines from edges to DOs
    geoJsonData.features.forEach(function(feature) {
      const props = feature.properties;
      const edgeLat = feature.geometry.coordinates[1];
      const edgeLon = feature.geometry.coordinates[0];
      bounds.extend([edgeLat, edgeLon]);

      // Draw lines to each DO location
      const doLocations = props.doLocations || [];
      doLocations.forEach(function(doLoc) {
        bounds.extend([doLoc.lat, doLoc.lon]);
        // Only draw line if DO is at a different location
        if (doLoc.lat !== edgeLat || doLoc.lon !== edgeLon) {
          L.polyline(
            [[edgeLat, edgeLon], [doLoc.lat, doLoc.lon]],
            {
              color: '#10b981', // Green to match worker/edge markers
              weight: 2,
              opacity: 0.6,
              dashArray: '5, 5'
            }
          ).addTo(map);
        }
        // Track DO location for later marker creation
        if (!doMarkersMap.has(doLoc.colo)) {
          doMarkersMap.set(doLoc.colo, doLoc);
        }
      });
    });

    // Second pass: draw lines from individual clients to their DOs (when tracking enabled)
    if (trackingEnabled && clientMarkers.length > 0) {
      clientMarkers.forEach(function(client) {
        bounds.extend([client.lat, client.lon]);
        bounds.extend([client.doLat, client.doLon]);

        // Draw line from client to DO (if different location)
        if (client.lat !== client.doLat || client.lon !== client.doLon) {
          L.polyline(
            [[client.lat, client.lon], [client.doLat, client.doLon]],
            {
              color: client.isLeader ? '#3b82f6' : '#9ca3af', // Blue for leader, gray for clients
              weight: 1.5,
              opacity: client.isLeader ? 0.8 : 0.5,
              dashArray: '3, 3'
            }
          ).addTo(map);
        }
        // Track DO for marker creation
        if (!doMarkersMap.has(client.doColo)) {
          doMarkersMap.set(client.doColo, { colo: client.doColo, lat: client.doLat, lon: client.doLon });
        }
      });
    }

    // Third pass: add edge location markers (aggregated view) - GREEN for Worker
    L.geoJSON(geoJsonData, {
      pointToLayer: function(feature, latlng) {
        const props = feature.properties;
        const radius = getMarkerRadius(props.sessionCount || 0);

        return L.circleMarker(latlng, {
          radius: radius,
          fillColor: '#10b981', // Green for worker/edge
          color: '#059669',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.7
        });
      },
      onEachFeature: function(feature, layer) {
        const props = feature.properties;
        const doLocations = props.doLocations || [];
        const doColos = doLocations.map(d => d.colo).join(', ');
        const popupContent = `
          <div class="p-2">
            <div class="font-bold text-base mb-2">${props.region || props.colo || 'Edge Location'}</div>
            <div class="space-y-1 text-sm">
              <div><span class="text-gray-500">Edge:</span> ${props.colo || 'Unknown'}</div>
              ${doColos ? `<div><span class="text-gray-500">DO(s):</span> ${doColos}</div>` : ''}
              <div><span class="text-gray-500">Sessions:</span> ${props.sessionCount || 0}</div>
              <div><span class="text-gray-500">Clients:</span> ${props.clientCount || 0}</div>
              <div><span class="text-gray-500">Last seen:</span> ${props.lastSeen ? new Date(props.lastSeen).toLocaleString() : 'Unknown'}</div>
            </div>
          </div>
        `;
        layer.bindPopup(popupContent);
      }
    }).addTo(map);

    // Fourth pass: add individual client markers (when tracking enabled)
    if (trackingEnabled && clientMarkers.length > 0) {
      clientMarkers.forEach(function(client) {
        const isLeader = client.isLeader;
        L.circleMarker([client.lat, client.lon], {
          radius: isLeader ? 6 : 4,
          fillColor: isLeader ? '#3b82f6' : '#9ca3af', // Blue for leader, gray for clients
          color: isLeader ? '#2563eb' : '#6b7280',
          weight: 2,
          opacity: 1,
          fillOpacity: isLeader ? 0.9 : 0.7
        }).addTo(map).bindPopup(`
          <div class="p-2">
            <div class="font-bold text-base mb-2">${isLeader ? 'Session Leader' : 'Connecting Client'}</div>
            <div class="space-y-1 text-sm">
              <div><span class="text-gray-500">Edge:</span> ${client.colo}</div>
              <div><span class="text-gray-500">DO:</span> ${client.doColo}</div>
              <div><span class="text-gray-500">Session:</span> ${client.sessionId.slice(0, 20)}...</div>
            </div>
          </div>
        `);
      });
    }

    // Fifth pass: add DO markers (ON TOP of everything else)
    doMarkersMap.forEach(function(doLoc, colo) {
      L.circleMarker([doLoc.lat, doLoc.lon], {
        radius: 8,
        fillColor: '#8b5cf6', // Purple
        color: '#7c3aed',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.9
      }).addTo(map).bindPopup(`
        <div class="p-2">
          <div class="font-bold text-base mb-2">DO Location: ${colo}</div>
          <div class="text-sm text-gray-500">
            Durable Object datacenter
          </div>
        </div>
      `);
    });

    // Fit map to bounds
    if (bounds.isValid()) {
      map.fitBounds(bounds, { padding: [50, 50] });
    }
  } else {
    // No data - show message
    const noDataDiv = L.DomUtil.create('div', 'no-data-message');
    noDataDiv.innerHTML = '<div class="text-center text-muted-foreground p-10">No active sessions to display</div>';
    noDataDiv.style.position = 'absolute';
    noDataDiv.style.top = '50%';
    noDataDiv.style.left = '50%';
    noDataDiv.style.transform = 'translate(-50%, -50%)';
    noDataDiv.style.zIndex = '1000';
    document.getElementById('map').appendChild(noDataDiv);
  }
</script>

<style>
  /* Ensure map stays below sidebar (sidebar uses z-50 = 50) */
  #map {
    position: relative;
    z-index: 0;
  }

  /* Leaflet elements should stay within the map container but preserve popup functionality */
  .leaflet-tile-pane,
  .leaflet-overlay-pane,
  .leaflet-shadow-pane,
  .leaflet-marker-pane {
    z-index: 1 !important;
  }

  /* Popup pane needs higher z-index to appear above markers */
  .leaflet-popup-pane {
    z-index: 10 !important;
  }

  /* Tooltip pane */
  .leaflet-tooltip-pane {
    z-index: 11 !important;
  }

  .leaflet-top,
  .leaflet-bottom {
    z-index: 40 !important;
  }

  /* Dark theme popup styling - solid background for readability */
  .leaflet-popup-content-wrapper {
    background: #1c1c1c !important;
    color: #e5e5e5 !important;
    border-radius: 0.5rem;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    border: 1px solid #333;
  }

  .leaflet-popup-tip {
    background: #1c1c1c !important;
    border-top: 1px solid #333;
  }

  .leaflet-popup-content {
    margin: 0;
  }

  .leaflet-popup-content .text-gray-500 {
    color: #9ca3af !important;
  }

  /* Map controls dark styling */
  .leaflet-control-zoom a {
    background: hsl(var(--card)) !important;
    color: hsl(var(--card-foreground)) !important;
    border-color: hsl(var(--border)) !important;
  }

  .leaflet-control-zoom a:hover {
    background: hsl(var(--secondary)) !important;
  }

  .leaflet-control-attribution {
    background: hsl(var(--card)) !important;
    color: hsl(var(--muted-foreground)) !important;
  }

  .leaflet-control-attribution a {
    color: hsl(var(--primary)) !important;
  }
</style>
