<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-5 mb-10 lg:mb-12">
  <div>
    <h2 class="text-2xl sm:text-3xl font-bold">World Map</h2>
    <p class="text-sm sm:text-base text-muted-foreground mt-2">Geographic distribution of synchronizer infrastructure</p>
  </div>
  <div class="flex gap-3">
    <button onclick="location.reload()" class="btn btn-secondary">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
        />
      </svg>
      Refresh
    </button>
    <a href="/ui/synchronizers" class="btn btn-primary">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
      View List
    </a>
  </div>
</div>

<!-- Summary stats -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-10">
  <div class="card p-6">
    <div class="text-sm text-muted-foreground mb-1">Total Synchronizers</div>
    <div class="text-3xl font-bold">{{total_synchronizers}}</div>
  </div>
  <div class="card p-6">
    <div class="text-sm text-muted-foreground mb-1">Total Sessions</div>
    <div class="text-3xl font-bold">{{total_sessions}}</div>
  </div>
  <div class="card p-6">
    <div class="text-sm text-muted-foreground mb-1">Total Clients</div>
    <div class="text-3xl font-bold">{{total_clients}}</div>
  </div>
</div>

<!-- Map container -->
<div class="card overflow-hidden">
  <div id="map" class="w-full h-[500px] lg:h-[600px]"></div>
</div>

<!-- Legend -->
<div class="mt-5 card p-5">
  <div class="text-sm font-medium mb-3">Legend</div>
  <div class="flex flex-wrap gap-6 text-sm text-muted-foreground">
    <div class="flex items-center gap-2">
      <div class="w-4 h-4 rounded-full bg-emerald-500"></div>
      <span>Active synchronizer</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 opacity-50"></div>
      <span>Smaller = fewer sessions</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 rounded-full bg-emerald-500 opacity-50"></div>
      <span>Larger = more sessions</span>
    </div>
  </div>
</div>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
  // GeoJSON data embedded from registry
  const geoJsonData = {{geojson_data}};

  // Initialize map
  const map = L.map('map', {
    center: [20, 0],
    zoom: 2,
    minZoom: 1,
    maxZoom: 18,
    worldCopyJump: true
  });

  // Dark theme tile layer (matches our UI)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);

  // Calculate marker size based on session count
  function getMarkerRadius(sessionCount) {
    const minRadius = 8;
    const maxRadius = 25;
    const minSessions = 1;
    const maxSessions = 100;

    const normalized = Math.min(1, Math.max(0, (sessionCount - minSessions) / (maxSessions - minSessions)));
    return minRadius + (maxRadius - minRadius) * Math.sqrt(normalized);
  }

  // Add GeoJSON layer with custom markers
  if (geoJsonData && geoJsonData.features && geoJsonData.features.length > 0) {
    L.geoJSON(geoJsonData, {
      pointToLayer: function(feature, latlng) {
        const props = feature.properties;
        const radius = getMarkerRadius(props.sessionCount || 0);

        return L.circleMarker(latlng, {
          radius: radius,
          fillColor: '#10b981',
          color: '#059669',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.7
        });
      },
      onEachFeature: function(feature, layer) {
        const props = feature.properties;
        const popupContent = `
          <div class="p-2">
            <div class="font-bold text-base mb-2">${props.label || 'Synchronizer'}</div>
            <div class="space-y-1 text-sm">
              <div><span class="text-gray-500">Region:</span> ${props.region || 'Unknown'}</div>
              <div><span class="text-gray-500">Sessions:</span> ${props.sessionCount || 0}</div>
              <div><span class="text-gray-500">Clients:</span> ${props.clientCount || 0}</div>
              <div><span class="text-gray-500">Last seen:</span> ${props.lastSeen ? new Date(props.lastSeen).toLocaleString() : 'Unknown'}</div>
            </div>
          </div>
        `;
        layer.bindPopup(popupContent);
      }
    }).addTo(map);

    // Fit map to show all markers
    const bounds = L.geoJSON(geoJsonData).getBounds();
    if (bounds.isValid()) {
      map.fitBounds(bounds, { padding: [50, 50] });
    }
  } else {
    // No data - show message
    const noDataDiv = L.DomUtil.create('div', 'no-data-message');
    noDataDiv.innerHTML = '<div class="text-center text-muted-foreground p-10">No active synchronizers to display</div>';
    noDataDiv.style.position = 'absolute';
    noDataDiv.style.top = '50%';
    noDataDiv.style.left = '50%';
    noDataDiv.style.transform = 'translate(-50%, -50%)';
    noDataDiv.style.zIndex = '1000';
    document.getElementById('map').appendChild(noDataDiv);
  }
</script>

<style>
  /* Dark theme popup styling */
  .leaflet-popup-content-wrapper {
    background: hsl(var(--card));
    color: hsl(var(--card-foreground));
    border-radius: 0.5rem;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
  }

  .leaflet-popup-tip {
    background: hsl(var(--card));
  }

  .leaflet-popup-content {
    margin: 0;
  }

  /* Map controls dark styling */
  .leaflet-control-zoom a {
    background: hsl(var(--card)) !important;
    color: hsl(var(--card-foreground)) !important;
    border-color: hsl(var(--border)) !important;
  }

  .leaflet-control-zoom a:hover {
    background: hsl(var(--secondary)) !important;
  }

  .leaflet-control-attribution {
    background: hsl(var(--card)) !important;
    color: hsl(var(--muted-foreground)) !important;
  }

  .leaflet-control-attribution a {
    color: hsl(var(--primary)) !important;
  }
</style>
