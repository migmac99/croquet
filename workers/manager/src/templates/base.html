<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} - Synq Manager</title>
    <style>
      {{styles}}
    </style>
  </head>
  <body class="bg-background text-foreground h-screen overflow-hidden">
    <div class="flex h-screen">
      <!-- Mobile overlay -->
      <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 lg:hidden opacity-0 invisible transition-all duration-200" onclick="closeSidebar()"></div>

      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="fixed lg:static inset-y-0 left-0 z-50 w-64 border-r border-border bg-background p-6 flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200 overflow-y-auto"
      >
        <div class="mb-8">
          <div class="flex items-center justify-between">
            <h1 class="text-xl font-bold flex items-center gap-2">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
              Synq Manager
            </h1>
            <button onclick="closeSidebar()" class="lg:hidden p-2 bg-secondary border border-border hover:bg-accent rounded-lg transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          <p class="text-sm text-muted-foreground mt-1">{{cluster}}</p>
        </div>

        <nav class="space-y-2 flex-1">
          <a href="/" onclick="closeSidebar()" class="flex items-center gap-3 px-5 py-3 rounded-lg {{nav_dashboard_active}} transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            Dashboard
          </a>
          <a href="/ui/keys" onclick="closeSidebar()" class="flex items-center gap-3 px-5 py-3 rounded-lg {{nav_keys_active}} transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
              />
            </svg>
            API Keys
          </a>
          <a href="/ui/sessions" onclick="closeSidebar()" class="flex items-center gap-3 px-5 py-3 rounded-lg {{nav_sessions_active}} transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
              />
            </svg>
            Sessions
          </a>
          <a href="/ui/accounts" onclick="closeSidebar()" class="flex items-center gap-3 px-5 py-3 rounded-lg {{nav_accounts_active}} transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
              />
            </svg>
            Accounts
          </a>

          <div class="mt-4 pt-4 border-t border-border">
            <p class="px-5 text-xs font-medium text-muted-foreground uppercase tracking-wider mb-2">Infrastructure</p>
          </div>

          <a
            href="/ui/synchronizers"
            onclick="closeSidebar()"
            class="flex items-center gap-3 px-5 py-3 rounded-lg {{nav_synchronizers_active}} transition-colors"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"
              />
            </svg>
            Synchronizers
          </a>
          <a href="/ui/map" onclick="closeSidebar()" class="flex items-center gap-3 px-5 py-3 rounded-lg {{nav_map_active}} transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            World Map
          </a>
          <a href="/ui/metrics" onclick="closeSidebar()" class="flex items-center gap-3 px-5 py-3 rounded-lg {{nav_metrics_active}} transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>
            Metrics
          </a>
          <a href="/ui/storage" onclick="closeSidebar()" class="flex items-center gap-3 px-5 py-3 rounded-lg {{nav_storage_active}} transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"
              />
            </svg>
            Storage
          </a>
          <a href="/ui/settings" onclick="closeSidebar()" class="flex items-center gap-3 px-5 py-3 rounded-lg {{nav_settings_active}} transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Settings
          </a>
        </nav>

        <div class="pt-6 border-t border-border">
          <div class="flex items-center gap-3 px-5 py-3">
            <div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center text-sm font-medium">{{user_initial}}</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate">{{user}}</p>
              <p class="text-xs text-muted-foreground">Admin</p>
            </div>
          </div>
        </div>
      </aside>

      <!-- Mobile header -->
      <div class="lg:hidden fixed top-0 left-0 right-0 z-30 bg-background border-b border-border px-4 py-3 flex items-center gap-3">
        <button onclick="toggleSidebar()" class="p-2.5 bg-secondary border border-border hover:bg-accent rounded-lg transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <h1 class="font-semibold text-lg">{{title}}</h1>
      </div>

      <!-- Main content -->
      <main class="flex-1 p-6 sm:p-10 lg:p-12 pt-20 sm:pt-20 lg:pt-12 overflow-y-auto">
        <div class="max-w-6xl mx-auto pb-8">{{content}}</div>
      </main>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Modal container -->
    <div
      id="modalOverlay"
      class="fixed inset-0 bg-black/60 z-9999 opacity-0 invisible transition-all duration-200 flex items-center justify-center p-4"
      onclick="if (event.target === this) closeModal()"
    >
      <div id="modalContent" class="card w-full max-w-md transform scale-95 opacity-0 transition-all duration-200">
        <div class="p-6">
          <h3 id="modalTitle" class="text-lg font-semibold mb-2">Confirm</h3>
          <p id="modalMessage" class="text-muted-foreground wrap-break-word"></p>
        </div>
        <div id="modalFooter" class="flex gap-3 p-4 border-t border-border justify-end">
          <button id="modalCancel" class="btn btn-ghost" onclick="closeModal(false)">Cancel</button>
          <button id="modalConfirm" class="btn btn-primary" onclick="closeModal(true)">Confirm</button>
        </div>
      </div>
    </div>

    <script>
      function toggleSidebar() {
        const sidebar = document.getElementById('sidebar')
        const overlay = document.getElementById('sidebarOverlay')
        sidebar.classList.toggle('-translate-x-full')
        sidebar.classList.toggle('translate-x-0')
        overlay.classList.toggle('opacity-0')
        overlay.classList.toggle('invisible')
      }
      function closeSidebar() {
        const sidebar = document.getElementById('sidebar')
        const overlay = document.getElementById('sidebarOverlay')
        sidebar.classList.add('-translate-x-full')
        sidebar.classList.remove('translate-x-0')
        overlay.classList.add('opacity-0')
        overlay.classList.add('invisible')
      }
      function showToast(message) {
        const container = document.getElementById('toastContainer')
        const toast = document.createElement('div')
        toast.className = 'toast'
        toast.innerHTML = `
          <svg class="w-4 h-4 text-green-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          <span>${message}</span>
        `
        container.appendChild(toast)
        setTimeout(() => {
          toast.classList.add('toast-out')
          setTimeout(() => toast.remove(), 200)
        }, 2000)
      }
      function copyToClipboard(text, label) {
        navigator.clipboard
          .writeText(text)
          .then(() => {
            showToast(`${label || 'Value'} copied`)
          })
          .catch(() => {
            showToast('Failed to copy')
          })
      }

      // Modal system - replaces browser confirm/alert
      let modalResolve = null

      function showConfirm(message, options = {}) {
        return new Promise((resolve) => {
          modalResolve = resolve
          const overlay = document.getElementById('modalOverlay')
          const content = document.getElementById('modalContent')
          const title = document.getElementById('modalTitle')
          const msg = document.getElementById('modalMessage')
          const cancelBtn = document.getElementById('modalCancel')
          const confirmBtn = document.getElementById('modalConfirm')

          title.textContent = options.title || 'Confirm'
          msg.textContent = message
          cancelBtn.textContent = options.cancelText || 'Cancel'
          confirmBtn.textContent = options.confirmText || 'Confirm'
          confirmBtn.className = options.danger ? 'btn btn-destructive' : 'btn btn-primary'
          cancelBtn.style.display = options.hideCancel ? 'none' : ''

          overlay.classList.remove('opacity-0', 'invisible')
          setTimeout(() => {
            content.classList.remove('scale-95', 'opacity-0')
          }, 10)
        })
      }

      function showAlert(message, options = {}) {
        return showConfirm(message, { ...options, hideCancel: true, confirmText: options.confirmText || 'OK' })
      }

      function closeModal(result = false) {
        const overlay = document.getElementById('modalOverlay')
        const content = document.getElementById('modalContent')

        content.classList.add('scale-95', 'opacity-0')
        setTimeout(() => {
          overlay.classList.add('opacity-0', 'invisible')
          if (modalResolve) {
            modalResolve(result)
            modalResolve = null
          }
        }, 200)
      }

      // Handle escape key for modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalResolve) {
          closeModal(false)
        }
      })
    </script>
    {{scripts}}
  </body>
</html>
