<!-- Header -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-5 mb-6">
  <div>
    <h2 class="text-2xl sm:text-3xl font-bold">Sessions</h2>
    <p class="text-sm sm:text-base text-muted-foreground mt-2">Active sessions on your cluster</p>
  </div>
  <div class="flex items-center gap-3">
    <select id="accountFilter" onchange="filterByAccount(this.value)" class="input w-40 shrink-0">
      <option value="">All accounts</option>
      {{account_options}}
    </select>
    <button
      id="refreshBtn"
      onclick="
        refreshSessionsData()
        countdown = 5
        updateRefreshButton()
      "
      class="btn btn-secondary"
    >
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
        />
      </svg>
      <span>Refresh (5s)</span>
    </button>
    <button id="pauseBtn" onclick="toggleAutoRefresh()" class="btn btn-secondary" title="Pause auto-refresh">
      <svg id="pauseIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <svg id="playIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"
        />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </button>
    <button onclick="purgeAllSessions()" class="btn btn-destructive">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
        />
      </svg>
      Purge All
    </button>
  </div>
</div>

<!-- Filters -->
<div class="flex items-center gap-4 mb-8">
  <label class="flex items-center gap-2 text-sm text-muted-foreground cursor-pointer select-none">
    <input
      type="checkbox"
      id="includeR2"
      onchange="toggleIncludeR2()"
      {{include_r2_checked}}
      class="w-4 h-4 rounded border-zinc-600 bg-zinc-800 text-primary focus:ring-primary focus:ring-offset-0"
    />
    Include archived sessions
  </label>
</div>

<!-- Mobile card view -->
<div class="lg:hidden space-y-5">{{session_cards}}</div>

<!-- Desktop table view -->
<div class="hidden lg:block card overflow-hidden">
  <div class="overflow-x-auto">
    <table class="w-full">
      <thead class="bg-secondary/50">
        <tr class="text-left text-sm text-muted-foreground">
          <th class="px-6 py-4 font-medium">Session ID</th>
          <th class="px-6 py-4 font-medium">Status</th>
          <th class="px-6 py-4 font-medium">App</th>
          <th class="px-6 py-4 font-medium">API Key</th>
          <th class="px-6 py-4 font-medium">Account</th>
          <th class="px-6 py-4 font-medium">Clients</th>
          <th class="px-6 py-4 font-medium">Location</th>
          <th class="px-6 py-4 font-medium">Created</th>
          <th class="px-6 py-4 font-medium">Last Activity</th>
          <th class="px-6 py-4 font-medium">Actions</th>
        </tr>
      </thead>
      <tbody>
        {{session_rows}}
      </tbody>
    </table>
  </div>
</div>
