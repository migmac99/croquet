<script>
  async function deleteSession(id) {
    const confirmed = await showConfirm('End this session? All connected clients will be disconnected.', {
      title: 'End Session',
      confirmText: 'End Session',
      danger: true,
    })
    if (!confirmed) return

    try {
      const res = await fetch('/sessions/' + encodeURIComponent(id), { method: 'DELETE' })
      if (!res.ok) throw new Error(await res.text())
      location.reload()
    } catch (err) {
      showAlert('Error: ' + err.message, { title: 'Error' })
    }
  }

  async function purgeAllSessions() {
    const confirmed = await showConfirm(
      'Purge ALL sessions? This will remove all session records from the registry. Active connections will be unaffected but will need to re-register.',
      {
        title: 'Purge All Sessions',
        confirmText: 'Purge All',
        danger: true,
      }
    )
    if (!confirmed) return

    try {
      const res = await fetch('/sessions/purge', { method: 'POST' })
      if (!res.ok) throw new Error(await res.text())
      const data = await res.json()
      showAlert(`Purged ${data.deleted} sessions`, { title: 'Success' })
      setTimeout(() => location.reload(), 1500)
    } catch (err) {
      showAlert('Error: ' + err.message, { title: 'Error' })
    }
  }

  function filterByAccount(accountId) {
    // Filter mobile cards
    document.querySelectorAll('[data-account-id]').forEach((el) => {
      const match = !accountId || el.dataset.accountId === accountId
      el.style.display = match ? '' : 'none'
    })

    // Update empty state visibility
    const mobileContainer = document.querySelector('.lg\\:hidden.space-y-5')
    const tableBody = document.querySelector('tbody')

    if (mobileContainer) {
      const visibleCards = mobileContainer.querySelectorAll('[data-account-id]:not([style*="display: none"])')
      const emptyCard = mobileContainer.querySelector('.text-center')
      if (emptyCard && !emptyCard.dataset.accountId) {
        emptyCard.style.display = visibleCards.length === 0 ? '' : 'none'
      }
    }

    if (tableBody) {
      const visibleRows = tableBody.querySelectorAll('tr[data-account-id]:not([style*="display: none"])')
      const emptyRow = tableBody.querySelector('tr:not([data-account-id])')
      if (emptyRow) {
        emptyRow.style.display = visibleRows.length === 0 ? '' : 'none'
      }
    }
  }
</script>
